; Локальный SIP для sim-режима: анонимные звонки из docker-сети принимаем в контекст default
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[anonymous]
type = endpoint
context = default
disallow = all
allow = ulaw
allow = alaw

[anonymous]
type = identify
endpoint = anonymous
match = 0.0.0.0/0
